name: Pass and run regression

on:
  pull_request:
    paths:
      - '.github/workflows/pass-and-run.yml'
      - 'lib/presentation/training_game/**'
      - 'lib/app/providers/training_game/**'
      - 'test/training_game/**'
      - 'assets/images/training_game/minigames/**/pass_run*.png'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  pass-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the validated Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify asset registration
        run: dart tool/update_asset_inputs.dart --check
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/presentation/training_game/mini_games/pass_and_run
          test/training_game/pass_and_run*.dart
      - name: Analyze pass and run
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/presentation/training_game/mini_games/pass_and_run
          test/training_game/pass_and_run_loading_test.dart
          test/training_game/pass_and_run_motion_test.dart
          test/training_game/pass_and_run_logic_test.dart
          test/training_game/pass_and_run_ball_visual_test.dart
          test/training_game/pass_and_run_integration_test.dart
      - name: Test pass and run
        run: >-
          flutter test --no-pub --reporter expanded
          test/training_game/pass_and_run_loading_test.dart
          test/training_game/pass_and_run_motion_test.dart
          test/training_game/pass_and_run_logic_test.dart
          test/training_game/pass_and_run_ball_visual_test.dart
          test/training_game/pass_and_run_integration_test.dart
          test/training_game/mini_game_widget_test.dart
