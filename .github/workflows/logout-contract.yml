name: Logout contract

on:
  pull_request:
    paths:
      - '.github/workflows/logout-contract.yml'
      - 'lib/presentation/profile/**'
      - 'test/auth/**'
      - 'lib/app/providers/auth/**'
      - 'lib/app/services/auth_token.dart'
      - 'lib/utils/my_shared_pref.dart'
      - 'test/registration_notification_sync_test.dart'
      - 'test/register_member_controller_one_shot_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  logout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the validated Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare compile-only compatibility for existing imports
        shell: bash
        run: |
          ln -s constant.dart lib/utils/Constant.dart
          ln -s string+extensions.dart lib/utils/String+extensions.dart
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart';
          // These mock-only tests must never initialize a real Firebase app.
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform =>
                throw StateError('Firebase initialization is forbidden in this CI');
          }
          DART
      - run: flutter pub get --enforce-lockfile
      - name: Check test formatting
        run: dart format --output=none --set-exit-if-changed test/auth/logout_contract_test.dart test/auth/delete_account_flow_test.dart
      - name: Test logout with fake providers and storage only
        run: flutter test --no-pub --concurrency=1 test/auth/logout_contract_test.dart test/auth/delete_account_flow_test.dart
