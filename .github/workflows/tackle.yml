name: Tackle regression

on:
  pull_request:
    paths:
      - '.github/workflows/tackle.yml'
      - 'lib/presentation/training_game/**'
      - 'lib/app/providers/training_game/**'
      - 'test/training_game/**'
      - 'assets/images/training_game/minigames/tackle*.png'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  tackle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the validated Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify asset registration
        run: dart tool/update_asset_inputs.dart --check
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/presentation/training_game/mini_games/tackle
          lib/presentation/training_game/mini_games/models/mini_game_result.dart
          lib/app/providers/training_game/training_game_provider.dart
          test/training_game/tackle*.dart
          test/training_game/mini_game_result_test.dart
          test/training_game/training_game_sync_queue_test.dart
          test/training_game/training_work_debug_day_test.dart
      - name: Analyze affected code
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/presentation/training_game/mini_games/tackle
          lib/presentation/training_game/mini_games/models/mini_game_result.dart
          lib/app/providers/training_game/training_game_provider.dart
          lib/presentation/training_game/controllers/training_game.controller.dart
          test/training_game/tackle_game_logic_test.dart
          test/training_game/tackle_player_visual_test.dart
          test/training_game/tackle_opponent_visual_test.dart
          test/training_game/tackle_contact_geometry_test.dart
          test/training_game/tackle_running_trajectory_test.dart
          test/training_game/tackle_intercept_widget_test.dart
          test/training_game/tackle_result_transport_test.dart
          test/training_game/tackle_trial_plan_test.dart
          test/training_game/tackle_variety_widget_test.dart
          test/training_game/tackle_test_driver.dart
          test/training_game/mini_game_result_test.dart
          test/training_game/training_game_sync_queue_test.dart
          test/training_game/training_work_debug_day_test.dart
      - name: Test tackle and sync compatibility
        run: >-
          flutter test --no-pub --reporter expanded
          test/training_game/tackle_game_logic_test.dart
          test/training_game/tackle_player_visual_test.dart
          test/training_game/tackle_opponent_visual_test.dart
          test/training_game/tackle_contact_geometry_test.dart
          test/training_game/tackle_running_trajectory_test.dart
          test/training_game/tackle_intercept_widget_test.dart
          test/training_game/tackle_result_transport_test.dart
          test/training_game/tackle_trial_plan_test.dart
          test/training_game/tackle_variety_widget_test.dart
          test/training_game/mini_game_result_test.dart
          test/training_game/training_game_sync_queue_test.dart
          test/training_game/training_work_debug_day_test.dart
          test/training_game/mini_game_widget_test.dart
