name: Child material regression

on:
  pull_request:
    paths:
      - '.github/workflows/child-materials.yml'
      - 'lib/presentation/training_game/training_hatching_scene.dart'
      - 'lib/presentation/training_game/training_game_flow.screen.dart'
      - 'lib/app/services/training_game_sound_service.dart'
      - 'assets/audio/training_game/hatching-charge.m4a'
      - 'test/training_game/training_hatching_audio_test.dart'
      - 'assets/images/training_game/child_care/**'
      - 'assets/images/training_game/main/jersey/newborn.png'
      - 'test/training_game/training_child_care_test.dart'
      - 'test/training_game/sametaroh_asset_test.dart'
      - 'test/training_game/training_game_new_game_screen_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  child-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the validated Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify asset registration
        run: dart tool/update_asset_inputs.dart --check
      - name: Check child frames and hatching display
        run: >-
          flutter test --no-pub --reporter expanded
          test/training_game/training_child_care_test.dart
          test/training_game/sametaroh_asset_test.dart
          test/training_game/training_game_new_game_screen_test.dart
          test/training_game/training_hatching_audio_test.dart
      - name: Check hatching sound formatting and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib/presentation/training_game/training_hatching_scene.dart test/training_game/training_hatching_audio_test.dart test/training_game/training_game_new_game_screen_test.dart
          flutter analyze --no-pub --no-fatal-infos lib/presentation/training_game/training_hatching_scene.dart lib/presentation/training_game/training_game_flow.screen.dart test/training_game/training_hatching_audio_test.dart
